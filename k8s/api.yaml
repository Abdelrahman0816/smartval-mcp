apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartval-api
  labels: { app: smartval-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: smartval-api }
  template:
    metadata:
      labels: { app: smartval-api }
    spec:
      containers:
        - name: api
          image: smartval-mcp:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: smartval-api
spec:
  selector: { app: smartval-api }
  ports: [{ port: 8000, targetPort: 8000 }]
