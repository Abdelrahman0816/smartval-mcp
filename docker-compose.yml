services:
  api:
    build: .
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 3

  mcp:
    build: .
    command: ["python", "-m", "smartval.mcp_server", "--http", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      SMARTVAL_API_URL: http://api:8000
    ports: ["8001:8001"]
    depends_on:
      api:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

volumes:
  ollama:
