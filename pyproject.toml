[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartval-mcp"
version = "0.1.0"
description = "AI agent + MCP server + REST API for the SmartValGuiden.se product catalogue"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "mcp>=2.3,<3",
  "ollama>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[project.scripts]
smartval-api = "smartval.cli:api"
smartval-mcp = "smartval.mcp_server:main"
smartval-agent = "smartval.agent:main"

[tool.setuptools]
packages = ["smartval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
